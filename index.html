 <section><h3>${T("pNet")}</h3><div class="switch"><button id="netSw" type="button" aria-pressed="${S.online}" aria-label="${T("pNet")}"></button><span>${S.online?T("netOn"):T("netOff")}</span></div>
  <label class="field">${T("pSlot")}<select id="slotSel"><option value="">${esc(T("slotAuto",{s:T("slots."+realSlot())}))}</option>${SLOTS.map(k=>`<option value="${k}" ${S.slotForced===k?"selected":""}>${esc(T("slots."+k))}</option>`).join("")}</select></label>
  <div class="small">${T("slotNote")}</div>
  <div class="lost"><div><b>${T("keep")}</b>${T("keepList")}</div><div class="x"><b>${T("lose")}</b>${T("loseList")}</div></div></section>
 ${apiPanelHTML()}
 <section><h3>${T("pExpr")}</h3><div class="exprline" id="exprLine"></div><div class="small">${T("pSim")}</div></section>
 <section><h3>${T("pArch")}</h3><table class="arch"><tbody>${T("archF").map((f,i)=>`<tr><td>${esc(f)}</td><td style="text-align:right"><span class="tag ${arch[i][0]==="loc"?"loc":(arch[i][1]?"rem":"off")}">${arch[i][0]==="loc"?T("loc"):T("rem")}</span><div class="small">${arch[i][0]==="loc"?T("active"):(arch[i][1]?T("active")+" · "+esc(via):(ARCH_FALLBACK.includes(i)&&i!==10?T("offlineLocal"):(i===10?T("offlineLocal"):T("inactive"))))}</div></td></tr>`).join("")}</tbody></table>
  <div class="declare">${T("declare")}</div></section>
 <section><h3>${T("pProfiles")}</h3>${profs}</section>
 <section><h3>${T("pLook")}</h3><div class="g2"><label class="field">${T("pTier")}<select id="tierSel"><option value="quick" ${MODEL_TIER_UI==="quick"?"selected":""}>${T("tierQuick")}</option><option value="default" ${MODEL_TIER_UI==="default"?"selected":""}>${T("tierDefault")}</option></select></label><label class="field">${T("pLang")}<select id="langSel"><option value="it" ${S.lang==="it"?"selected":""}>Italiano</option><option value="en" ${S.lang==="en"?"selected":""}>English</option></select></label></div></section>
 ${s&&!s.ended&&S.phase==="done"?`<section class="endbox"><h3>${T("pEndBox")}</h3><div class="btnrow"><button class="pillbtn" id="btnNewComp" type="button">${T("pNewComp")}</button></div><div class="small">${T("pNewCompHint")}</div>
  <div class="btnrow"><button class="pillbtn sec" id="btnCloseSes" type="button">${T("pCloseSes")}</button></div><div class="small">${T("pCloseHint")}</div></section>`:""}`;
 document.getElementById("stageMeta").textContent=s?s.pid+(s.cycle>1?` · Pod ${s.cycle}`:""):"";
 updatePanelLive();
}
function updatePanelLive(){ const F=faceFor(), el=document.getElementById("exprLine"); if(el) el.textContent=F.n?`faccina ${F.n} ← ${F.v}`:T("noFace");
 const ph=document.getElementById("phaseLine"); if(ph) ph.textContent=T("phases."+S.phase)+(S.phase==="compose"?" · "+T("screens")[S.ui.screen]:"");
 const ec=document.getElementById("evCount"); if(ec&&S.session) ec.textContent=S.session.events.length; }
function updateDrawerLive(){ updatePanelLive(); }
panel.addEventListener("click",async e=>{
 const b=e.target.closest("button"); if(!b) return;
 if(b.id==="netSw"){ S.online=!S.online; if(!S.online&&S.ctl) S.ctl.abort(); log("offline_toggle",{to:S.online?"online":"offline"}); if(S.phase==="listen") S.line=null; render(); return; }
 if(b.dataset.hk){ const pk=b.closest("[data-pk]").dataset.pk, p=S.profiles[pk], k=b.dataset.hk, v=b.dataset.hv; p.health=p.health||{allergies:null,intolerances:null,conditions:null,extraIds:[]};
  const cur=p.health[k]||[]; p.health[k]=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]; deriveConstraints(p);
  log("profile_edit",{key:pk, field:k, filled:true, by:"researcher"}); if(S.comp) trackViolations("profile_change"); render(); return; }
 if(b.id==="btnExport") return exportLog();
 if(b.id==="btnCopy"){ try{ await navigator.clipboard.writeText(JSON.stringify(buildLog(),null,2)); S.ui.exportMsg=T("pCopied"); }catch(_){ S.ui.exportMsg=T("pExportErr"); } renderPanel(); return; }
 if(b.id==="btnCancel"){ if(S.ctl) S.ctl.abort(); return; }
 if(b.id==="btnRest"){ commitEdit(); clearTimers(); S.activeFormulation=null; log("researcher_reset",{}); S.phase="rest"; S.comp=null; S.line=null; S.profileKey=null; S.fixOffer=null; S.load=null; S.prep.step=-1; render(); return; }
 if(b.id==="btnContinue"){ continueCycle(); return; }
 if(b.id==="btnNewComp"){ continueCycle(); setPanel(false,"continue"); return; }
 if(b.id==="btnCloseSes"){ closeSession(); return; }
 if(b.id==="btnImport"){ pickImportFile(msg=>{ if(msg){ S.ui.exportMsg=msg; renderPanel(); } }); return; }
 if(b.id==="apiSave"){ const c=apiCfg(), pv=c.provider, k=document.getElementById("apiKeyIn").value.trim(), q=document.getElementById("apiQuickIn").value.trim(), d=document.getElementById("apiDefIn").value.trim();
  if(k) c.keys[pv]=k; c.models[pv]={quick:q||PROVIDERS[pv].quick, def:d||PROVIDERS[pv].def}; apiStore(c); setupStandaloneModel(); S.apiMsg=""; log("api_config",{provider:pv, model_quick:c.models[pv].quick, model_default:c.models[pv].def, key_set:!!c.keys[pv]}); render(); return; }
 if(b.id==="apiTest"){ apiTest(); return; }
 if(b.id==="apiForget"){ const c=apiCfg(); delete c.keys[c.provider]; apiStore(c); setupStandaloneModel(); S.apiMsg=""; render(); return; }
 if(b.id==="btnEnd"){ endSession(); render(); return; }
 if(b.id==="btnNew"){ try{localStorage.removeItem("handpod_v5_log_backup");}catch(_){} location.reload(); return; }
});
panel.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="apiProvSel"){ const c=apiCfg(); c.provider=t.value; apiStore(c); setupStandaloneModel(); S.apiMsg=""; render(); return; }
 if(t.id==="slotSel"){ S.slotForced=t.value||null; log("slot_forced",{to:S.slotForced, slot_real:realSlot(), slot_used:slotInfo().used}); render(); return; }
 if(t.id==="tierSel"){ MODEL_TIER_UI=t.value; log("model_tier_change",{to:t.value}); return; }
 if(t.id==="langSel"){ S.lang=t.value; log("language_change",{to:S.lang}); curKey=null; if(!S.chat.length) renderChatEmpty(); render(); return; }
 const box=t.closest("[data-pk]"); if(!box) return; const p=S.profiles[box.dataset.pk], f=t.dataset.f;
 p[f]=(f==="name"||f==="likes")?t.value.slice(0,200):Math.max(1,Math.round(Number(t.value)||p[f])); if(f==="name") p.initial=(p.name[0]||"").toUpperCase();
 if(["p","c","f"].includes(f)){ p.base[f]=p[f]; deriveConstraints(p); }
 log("profile_edit",{key:p.key, field:f, value:p[f], by:"researcher"}); if(S.comp) trackViolations("profile_change"); t.blur(); render();
});
async function exportLog(){
 if(!S.session||!S.downloads) return;
 const L=buildLog(), stamp=new Date(S.session.t0).toISOString().slice(0,16).replace(/[:T]/g,"-"), safe=String(S.session.pid).replace(/[^\w-]+/g,"_").slice(0,40)||"p";
 try{ await S.downloads.save({filename:`handpod_${safe}_${stamp}.json`, data:JSON.stringify(L,null,2)}); S.ui.exportMsg=T("pSaved"); log("log_exported",{}); }
 catch(e){ S.ui.exportMsg=e&&e.code==="declined"?T("pDeclined"):T("pExportErr"); if(e&&e.code==="unavailable") S.downloads=null; }
 renderPanel();
}
function endSession(){ if(!S.session||S.session.ended) return; if(S.ctl) S.ctl.abort(); clearTimers(); log("session_end",{}); S.session.ended=Date.now(); backup(); }

/* ---------------- 17. SETUP E AVVIO ---------------- */
const setup=document.getElementById("setup");
function renderSetup(){
 let bk=null; try{ bk=JSON.parse(localStorage.getItem("handpod_v5_log_backup")||"null"); }catch(_){}
 setup.innerHTML=`<form class="card" id="setupForm" autocomplete="off"><h1>Hand<em>Pod</em></h1><div style="font-family:var(--f-display);font-size:20px">${T("setupTitle")}</div><div class="small">${T("setupSub")}</div>
  <label class="field">${T("setupPid")}<input id="setPid" type="text" required maxlength="40" placeholder="P01"></label>
  <label class="field">${T("pLang")}<select id="setLang"><option value="it" ${S.lang==="it"?"selected":""}>Italiano</option><option value="en" ${S.lang==="en"?"selected":""}>English</option></select></label>
  <button class="pillbtn" type="submit">${T("setupGo")}</button>
  <button class="pillbtn sec" type="button" id="setImport">${T("setupImport")}</button><div class="small" id="setImportMsg"></div>
  ${bk&&bk.events&&bk.events.length?`<div class="small">${T("setupBackup",{d:esc((bk.participant_id||"")+" · "+new Date(bk.started_at).toLocaleString())})}</div><div class="btnrow"><button class="pillbtn sec" type="button" id="bkExport">${T("setupBackupBtn")}</button><button class="pillbtn sec" type="button" id="bkDrop">${T("setupBackupDrop")}</button></div><div class="small" id="bkMsg"></div>`:""}</form>`;
 setup.querySelector("#setLang").addEventListener("change",e=>{ S.lang=e.target.value; renderSetup(); render(); });
 setup.querySelector("#setupForm").addEventListener("submit",e=>{ e.preventDefault(); const pid=setup.querySelector("#setPid").value.trim(); if(pid) startSession(pid); });
 setup.querySelector("#setImport").addEventListener("click",()=>pickImportFile(msg=>{ if(msg) setup.querySelector("#setImportMsg").textContent=msg; }));
 const bx=setup.querySelector("#bkExport");
 if(bx) bx.addEventListener("click",async()=>{ const m=setup.querySelector("#bkMsg"); if(!S.downloads){ m.textContent=T("pExportNA"); return; }
  try{ await S.downloads.save({filename:`handpod_${String(bk.participant_id||"p").replace(/[^\w-]+/g,"_")}_recuperato.json`, data:JSON.stringify(bk,null,2)}); m.textContent=T("pSaved"); }catch(err){ m.textContent=err&&err.code==="declined"?T("pDeclined"):T("pExportErr"); } });
 const bd=setup.querySelector("#bkDrop"); if(bd) bd.addEventListener("click",()=>{ try{localStorage.removeItem("handpod_v5_log_backup");}catch(_){} renderSetup(); });
}
/* IMPORTA SESSIONE: dal log esportato riprende partecipante, profili (scheda completa) e conversazione;
   la macchina riparte dal riposo per una nuova Pod e il log continua nello stesso file. */
function restoreProfile(x){
 const drop=["alg","excl","refusedIds","rules","tastes_by_moment","excluded_ingredients","refused_ingredients","rule_limits","base","constraints_active","taste_followup"];
 if(x&&x.health&&typeof x.health==="object"&&!("filled" in x.health)){ const o={...x}; drop.forEach(k=>delete o[k]); o.tastes={...Object.fromEntries(SLOTS.map(k=>[k,null])),...(x.tastes||x.tastes_by_moment||{})}; o.tastesAsked=x.tastesAsked||{}; return {p:newProfile(o), partial:false}; }
 const sp=x&&x.split||[25,50,25]; return {p:newProfile({key:x.key, initial:(x.name||"?")[0].toUpperCase(), name:x.name||"", kcal:x.kcal||600, p:sp[0], c:sp[1], f:sp[2], likes:x.likes||"", created:!!x.created}), partial:true};
}
function importSession(L){
 if(!L||typeof L!=="object"||!/^handpod-session-log\//.test(L.schema||"")||!Array.isArray(L.events)) throw new Error("format");
 clearTimers(); if(S.ctl) S.ctl.abort();
 const pods=(L.summary&&L.summary.pod_shown)||[];
 S.lang=L.language==="en"?"en":"it";
 S.session={pid:L.participant_id||"P?", scenario:null, cycle:pods.length+1, t0:Date.parse(L.started_at)||Date.now(), ended:null, events:L.events.slice(), podVariant:pods.length?Math.max(0,(pods[0].variant||1)-1):Math.floor(Math.random()*POD_CROPS.length)};
 const prof0=defaultProfiles(); let partial=false; const out={};
 for(const [k,x] of Object.entries(L.profiles||{})){ if(k==="guest"){ out.guest=prof0.guest; continue; } const r=restoreProfile({...x,key:k}); out[k]=r.p; partial=partial||r.partial; }
 S.profiles={main:prof0.main, second:prof0.second, guest:prof0.guest, ...out};
 S.createdCount=Math.max(0,...Object.keys(S.profiles).map(k=>+(k.match(/^new(\d+)$/)||[])[1]||0));
 /* conversazione: ridisegnata com'era, senza riscriverla nel log */
 S.chat=[]; msgsEl.innerHTML=""; let prev=null;
 for(const e of L.events) if(e.type==="chat_message"&&e.text){ drawMsg(e.who,e.text,e.awaits_click,prev); prev={who:e.who}; S.chat.push({who:e.who,text:e.text,t:Date.parse(e.t)}); }
 msgsEl.insertAdjacentHTML("beforeend",`<div class="msg-sep">${esc(T("resumed"))}</div>`); msgsEl.scrollTop=msgsEl.scrollHeight; S.chat.push({who:"sep",text:""});
 device.classList.remove("podded"); powderLayers.innerHTML="";
 Object.assign(S,{phase:"rest", comp:null, load:null, prep:{step:-1}, activeFormulation:null, profileKey:null, fixOffer:null, slotAsk:null, line:null, rework:null, waitSince:null, pending:null});
 lastSig=null; setup.hidden=true;
 log("session_resumed",{from_events:L.events.length, profiles:Object.keys(out), cycle:S.session.cycle, partial_profiles:partial});
 S.ui.exportMsg=T("pImportOk",{p:S.session.pid})+(partial?" "+T("pImportPartial"):"");
 render(); noteLine("clickNote");
}
function pickImportFile(onDone){ const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
 inp.addEventListener("change",async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; let msg=null;
  try{ importSession(JSON.parse(await f.text())); }catch(e){ msg=T("pImportErr"); } onDone&&onDone(msg); });
 inp.click(); }
function startSession(pid,scenario=null){
 S.session={pid, scenario, cycle:1, t0:Date.now(), ended:null, events:[], podVariant:Math.floor(Math.random()*POD_CROPS.length)};
 S.profiles=defaultProfiles(); S.profileKey=null; S.phase="rest"; setup.hidden=true; S.chat=[]; renderChatEmpty();
 log("session_start",{panel_open:!!S.ui.panelOpen, slot_real:realSlot(), participant_id:pid, scenario, language:S.lang, user_agent:navigator.userAgent.slice(0,160), viewport:[innerWidth,innerHeight], sample_available:typeof S.sample==="function", downloads_available:!!S.downloads});
 render(); noteLine("clickNote"); // la macchina è a riposo e aspetta un tocco: lo dice l'annotazione, prima del "Ciao"
}
/* DUE AMBIENTI. Dentro Claude (artifact): modello e salvataggio arrivano dalle capacità `sample` e `downloads`.
   Fuori da Claude (sito, es. GitHub Pages): il salvataggio è un normale download del browser e il modello è l'API
   Anthropic chiamata con una chiave che il ricercatore inserisce nel pannello e che resta solo in quel browser. */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
/* servizi supportati fuori da Claude. Google Gemini (predefinito): piano gratuito con limiti per progetto visibili in
   AI Studio; come rapido Flash-Lite (più richieste al giorno), come bilanciato Flash. Nomi dei modelli verificati a ottobre 2026.
   OpenRouter: modelli con nome che finisce in ":free", gratuiti con limiti
   giornalieri (verificati a ottobre 2026: 20 richieste al minuto, 50 al giorno senza credito acquistato). */
const PROVIDERS={
 google:{label:"Google Gemini (piano gratuito)", quick:"gemini-3.5-flash-lite", def:"gemini-3.8-flash", keyHint:"AIza…", site:"aistudio.google.com"},
 openrouter:{label:"OpenRouter (modelli gratuiti)", quick:"minimax/minimax-m3.1-flash:free", def:"minimax/minimax-m3.1-flash:free", keyHint:"sk-or-…", site:"openrouter.ai"},
 anthropic:{label:"Anthropic (a pagamento)", quick:"claude-haiku-5-5", def:"claude-sonnet-5-5", keyHint:"sk-ant-…", site:"console.anthropic.com"}};
function apiCfg(){ let c={}; try{ c=JSON.parse(localStorage.getItem("handpod_api")||"null")||{}; }catch(_){}
 if(c.key&&!c.keys){ c={provider:"anthropic", keys:{anthropic:c.key}, models:{anthropic:{quick:c.quick,def:c.def}}}; } // formato precedente
 c.keys=c.keys||{}; c.models=c.models||{};
 if(c.v!==3){ c.provider="google"; c.v=3; delete c.keys.deepseek; delete c.models.deepseek; apiStore(c); } // servizio predefinito: Google Gemini; le altre chiavi salvate restano
 c.provider=PROVIDERS[c.provider]?c.provider:"google"; return c; }
function apiStore(v){ try{ if(v) localStorage.setItem("handpod_api",JSON.stringify(v)); else localStorage.removeItem("handpod_api"); }catch(_){} }
function modelFor(c,tier){ const pv=c.provider, m=c.models[pv]||{}; return tier==="default"?(m.def||PROVIDERS[pv].def):(m.quick||PROVIDERS[pv].quick); }
async function callProvider(c,prompt,opt){
 const pv=c.provider, key=c.keys[pv], model=modelFor(c,opt.modelTier); let res;
 try{
  if(pv==="openrouter") res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST", signal:opt.signal,
    headers:{"content-type":"application/json","authorization":"Bearer "+key,"HTTP-Referer":location.origin,"X-Title":"HandPod prototipo"},
    body:JSON.stringify({model, max_tokens:2048, messages:[{role:"user",content:prompt}]})});
  else if(pv==="google") res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST", signal:opt.signal,
    headers:{"content-type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}], generationConfig:{maxOutputTokens:8192, responseMimeType:"application/json"}})});
  else res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST", signal:opt.signal,
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model, max_tokens:2048, messages:[{role:"user",content:prompt}]})});
 }catch(e){ const er=new Error("net"); er.code=(e&&e.name==="AbortError")?"cancelled":"network"; if(er.code==="network") S.apiMsg=T("apiNet"); throw er; }
 /* Google risponde 400 anche per una chiave non valida: si legge il messaggio */
 let badKey=false; if(!res.ok&&res.status===400&&pv==="google"){ try{ const ej=await res.clone().json(); badKey=/api key|API_KEY/i.test(JSON.stringify(ej)); }catch(_){} }
 if(!res.ok&&badKey){ const er=new Error("auth"); er.code="auth"; S.apiMsg=T("apiBad"); throw er; }
 if(!res.ok){ const er=new Error("http "+res.status); er.code=res.status===429?"rate_limited":(res.status===401||res.status===403)?"auth":"http_"+res.status;
  S.apiMsg=res.status===429?T("apiLimit"):(res.status===401||res.status===403)?T("apiBad"):res.status===404?T("apiModel"):res.status===402?T("apiCredit"):T("apiHttp",{n:res.status}); throw er; }
 const j=await res.json();
 const txt=pv==="openrouter"?String((((j.choices||[])[0]||{}).message||{}).content||"")
  :pv==="google"?((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(x=>x.text||"").join("")
  :(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
 if(j.error){ S.apiMsg=T("apiHttp",{n:j.error.code||"?"}); const er=new Error("api"); er.code="api_error"; throw er; }
 S.apiMsg=""; return txt;
}
function setupStandaloneModel(){
 const c=apiCfg(); if(!c.keys[c.provider]){ S.sample=null; return; }
 const f=async()=>({});
 f.json=async(prompt,opt={})=>{ const txt=await callProvider(apiCfg(),prompt,opt);
  const a=txt.indexOf("{"), b=txt.lastIndexOf("}"); if(a<0||b<a) return {}; try{ return JSON.parse(txt.slice(a,b+1)); }catch(_){ return {}; } };
 S.sample=f;
}
function apiPanelHTML(){ if(IN_CLAUDE) return ""; const c=apiCfg(), pv=c.provider, P=PROVIDERS[pv], k=c.keys[pv], m=c.models[pv]||{};
 return `<section><h3>${T("pApi")}</h3>
  <label class="field">${T("apiProv")}<select id="apiProvSel">${Object.keys(PROVIDERS).map(x=>`<option value="${x}" ${x===pv?"selected":""}>${esc(PROVIDERS[x].label)}</option>`).join("")}</select></label>
  <label class="field">${T("apiKey")} (${esc(P.site)})<input id="apiKeyIn" type="password" autocomplete="off" placeholder="${esc(P.keyHint)}"></label>
  <div class="g2"><label class="field">${T("apiQuick")}<input id="apiQuickIn" type="text" value="${esc(m.quick||P.quick)}"></label><label class="field">${T("apiDef")}<input id="apiDefIn" type="text" value="${esc(m.def||P.def)}"></label></div>
  <div class="btnrow"><button class="pillbtn" id="apiSave" type="button">${T("apiSave")}</button>${k?`<button class="pillbtn sec" id="apiTest" type="button">${T("apiTest")}</button><button class="pillbtn sec" id="apiForget" type="button">${T("apiForget")}</button>`:""}</div>
  <div class="small" id="apiMsgEl">${esc(S.apiMsg||(k?T("apiSaved",{k:k.slice(-4)}):T("apiNone")))}</div><div class="small">${T("apiNote")}</div></section>`; }
async function apiTest(){ const el=document.getElementById("apiMsgEl"); if(el) el.textContent=T("apiTesting");
 try{ const t=await callProvider(apiCfg(),'Reply with only {"ok":true}',{modelTier:"quick"}); S.apiMsg=/ok/.test(t)?T("apiOk"):T("apiOdd"); }catch(e){ if(!S.apiMsg) S.apiMsg=T("apiNet"); }
 log("api_test",{provider:apiCfg().provider, result:S.apiMsg}); renderPanel(); }
if(IN_CLAUDE){
 (async()=>{ let s=null; try{ s=await window.claude.use("sample"); }catch(_){ s=null; } S.sample=(typeof s==="function")?s:null; render(); if(S.session) log("capability",{sample:typeof S.sample==="function"}); if(!setup.hidden) renderSetup(); })();
 (async()=>{ let d=null; try{ d=await window.claude.use("downloads"); }catch(_){ d=null; } S.downloads=d||null; renderPanel(); if(!setup.hidden) renderSetup(); })();
} else {
 setupStandaloneModel();
 S.downloads={save:async({filename,data})=>{ const u=URL.createObjectURL(new Blob([data],{type:"application/json"})); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); return {status:"saved"}; }};
}
renderSetup(); renderChatEmpty(); render(); scheduleBlink();
</script>
