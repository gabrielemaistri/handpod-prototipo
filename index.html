<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HandPod Prototipo</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: device top view (the rendered cap image, a static asset) on a neutral ground; the voice-simulation card sits under the device; the research panel stays open alongside in landscape and below in portrait. The display keeps its own fixed product palette. */
:root{
  --bg:#E4E2DE; --fg:#1C1B19; --fg-2:#5E5A54; --line:#C3BFB8; --panel:#EFEDE9; --accent:#B87508; --ok:#3F6B4A; --clk:#C25A12;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --scr-bg:#060606; --scr-fg:#F1EFEA; --scr-dim:#8C8880; --scr-faint:#2E2D2B; --scr-calm:#D9B26A;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#171716; --fg:#ECEAE6; --fg-2:#A29E97; --line:#3A3936; --panel:#1F1F1D; --accent:#E3A53A; --ok:#7FB08A; --clk:#F2924A; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#171716; --fg:#ECEAE6; --fg-2:#A29E97; --line:#3A3936; --panel:#1F1F1D; --accent:#E3A53A; --ok:#7FB08A; --clk:#F2924A; color-scheme:dark }

[hidden]{display:none!important} /* la finestra iniziale si nasconde anche fuori da Claude */
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pannello del ricercatore: chiuso all'avvio. La colonna si allarga con una transizione e il palco (macchina e chat)
   si ricentra nello spazio rimasto; il device non cambia dimensione perché la sua misura dipende dalla finestra. */
/* LAYOUT: conversazione a sinistra, macchina grande al centro, pannello del ricercatore a destra (chiuso all'avvio). */
#app{--pw:min(380px,34vw);--chatW:clamp(260px,24vw,360px);height:100%;box-sizing:border-box;display:grid;grid-template-areas:"chat stage tog panel";grid-template-columns:var(--chatW) minmax(0,1fr) 34px 0px;gap:0;padding-block:14px;transition:grid-template-columns 450ms var(--ease)}
#app.pOpen{grid-template-columns:var(--chatW) minmax(0,1fr) 34px var(--pw)}
.chatcol{grid-area:chat;min-width:0;min-height:0;display:flex;padding-right:20px}
.stage{grid-area:stage} .ptog{grid-area:tog} .panelWrap{grid-area:panel}
.panelWrap{min-width:0;min-height:0;overflow:hidden;display:flex;justify-content:flex-start}
.panelWrap .panel{width:var(--pw);flex:none;box-sizing:border-box}
.ptog{align-self:center;justify-self:center;width:26px;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg-2);display:grid;place-items:center;padding:0;z-index:5}
.ptog:hover{color:var(--fg)}
.ptog svg{width:12px;height:12px;transition:transform 450ms var(--ease)}
#app.pOpen .ptog svg{transform:rotate(180deg)}
@media (max-aspect-ratio: 1/1){ #app{grid-template-areas:"stage" "chat";grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)} #app.pOpen{grid-template-columns:minmax(0,1fr)}
 .chatcol{padding-right:0;padding-top:12px}
 .ptog{position:fixed;right:6px;top:50%;transform:translateY(-50%);transition:right 450ms var(--ease)}
 #app.pOpen .ptog{right:calc(min(380px,88vw) + 10px)}
 .panelWrap{position:fixed;top:10px;bottom:10px;right:0;width:0;z-index:4;transition:width 450ms var(--ease)}
 #app.pOpen .panelWrap{width:min(380px,88vw)}
 .panelWrap .panel{width:min(380px,88vw)} }
@media (prefers-reduced-motion: reduce){ #app,.ptog,.ptog svg,.panelWrap{transition:none} }
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;padding-top:36px;padding-inline:8px}
.stage-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--fg-2);letter-spacing:.06em;text-transform:uppercase}
.brand{font-family:var(--f-display);font-size:18px;letter-spacing:.02em;text-transform:none;color:var(--fg)}
.brand em{font-style:italic}

/* ---------- device ---------- */
/* rig: device al centro; dopo Conferma il device trasla a destra e a sinistra compare la ciotola */
.rig{position:relative;width:100%;display:flex;justify-content:center;flex:none;--dx:0px;--k:1}
.device{width:var(--S);height:var(--S);position:relative;flex:none;user-select:none;-webkit-user-select:none;transition:transform 750ms var(--ease)}
:root{--chatH:calc(clamp(96px,17vh,220px) + 140px)}
.rig.open .device{transform:translateX(var(--dx)) scale(var(--k))}
body.closable,.device.closable,body.tapwait{cursor:pointer}
.bowl{position:absolute;left:50%;top:50%;width:calc(var(--S) * .9);height:calc(var(--S) * .9);transform:translate(-50%,-50%) translateX(calc(-1 * var(--dx))) scale(var(--k));opacity:0;pointer-events:none;transition:opacity 600ms var(--ease)}
.rig{--S:min(calc(100vh - 28px - 36px - 40px),calc(100vw - var(--chatW) - 20px - 34px - 72px),1000px)}
@media (max-aspect-ratio: 1/1){ .rig{--S:min(58vh,92vw,900px)} }
/* a pannello aperto la macchina si riduce in proporzione (stessa immagine, stessa registrazione dello schermo) per restare nel palco */
.rig{transform:scale(var(--kp,1));transition:transform 450ms var(--ease)}
@media (prefers-reduced-motion: reduce){ .rig{transition:none} }
.rig.open .bowl{opacity:1}
.bowl > img:first-child,.bowl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* misurino: largo 62% della ciotola; il perno (labbro sinistro della coppa) cade sopra il centro, a 22% dall'alto */
.bowl .scoop{position:absolute;width:62%;height:auto;left:calc(50% - 62% * .0132);top:calc(22% - 62% * (160 / 454) * .225);transform-origin:1.32% 22.5%;opacity:0;pointer-events:none}
.bowl .stream{position:absolute;left:49.1%;width:1.8%;top:22%;height:28%;border-radius:1px 1px 40% 40%;opacity:0;filter:blur(.4px)}
@media (prefers-reduced-motion: reduce){ .bowl .scoop,.bowl .stream{display:none} }
.bowl .pw{transform-origin:0 0;transform:scale(.18);opacity:0;transition:transform 900ms cubic-bezier(.2,.7,.25,1),opacity 260ms linear}
.bowl .pw.in{transform:scale(1);opacity:1}
@media (prefers-reduced-motion: reduce){ .device,.bowl,.bowl .pw{transition:none} }
.obj{position:absolute;width:135.3%;height:135.3%;left:-17.67%;top:-17.5%;pointer-events:none} /* il riquadro trasparente dell'immagine sborda: non deve intercettare i tocchi */
.obj{transition:opacity 700ms var(--ease)}
.device.podded .obj{opacity:0}
/* la Pod: un po' più piccola della macchina (80% del riquadro), compare in dissolvenza mentre la macchina scompare */
.pod{position:absolute;left:10%;top:10%;width:80%;height:80%;opacity:0;pointer-events:none;background-image:url(handpod_pods.png);background-repeat:no-repeat;transition:opacity 800ms var(--ease) 350ms}
.device.podded .pod{opacity:1}
.obj img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}

/* ---------- display ---------- */
.screen{position:absolute;left:calc(var(--cx) - var(--d)/2);top:calc(var(--cy) - var(--d)/2);width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;background:transparent;color:var(--scr-fg);
  container-type:size;font-family:var(--f-body);touch-action:none;pointer-events:auto;
  /* registrazione sul disco nero dell'immagine (2560x2560): misurata con un fit circolare sul bordo del disco */
  --cx:49.66%; --cy:51.76%; --d:28.0%}
.layer{position:absolute;inset:0;transition:opacity 210ms var(--ease)}
.faceSlot{position:absolute;left:14cqw;top:6cqh;width:72cqw;height:72cqh;pointer-events:none}
.faceSlot svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 210ms var(--ease)}
.faceSlot svg.in{opacity:1}
.faceSlot.off{opacity:0}
.content{position:absolute;inset:0}
.content > div{position:absolute;inset:0;opacity:0;transition:opacity 210ms var(--ease)}
.content > div.in{opacity:1}

/* face animations: loops never touch the face circle (fixed viewBox, fixed slot) */
.fc .eyes,.fc .el,.fc .er,.fc .hd,.fc .ps,.fc .pin,.fc .grain{transform-box:fill-box}
.fc .el,.fc .er{transform-origin:center;transition:transform 70ms ease-in}
.fc.blink .el,.fc.blink .er{transform:scaleY(.08)}
.fc[data-f="2"] .hd{transform-origin:50% 100%;animation:wave 3.6s var(--ease) infinite}
.fc[data-f="2"] .eyes{animation:lift 3.6s var(--ease) infinite}
.fc[data-f="3"] .hd{animation:chin 2.8s ease-in-out infinite}
.fc[data-f="4"] .hd{animation:found .75s var(--ease) .15s 1 both}
.fc[data-f="5"] .eyes,.fc[data-f="6"] .eyes{animation:sway 3.2s ease-in-out infinite alternate}
.fc[data-f="6"] .pin{animation:roll 1.8s ease-in-out infinite alternate}
.fc[data-f="6"] .grain{animation:grain .6s linear infinite}
.fc[data-f="7"] .hd{animation:bounce .8s var(--ease) .15s 1 both}
.fc[data-f="7"] .wkA{animation:winkA 4.8s ease-in-out infinite}
.fc[data-f="7"] .wkB{opacity:0;animation:winkB 4.8s ease-in-out infinite}
@keyframes wave{0%,44%,100%{transform:rotate(0)}8%{transform:rotate(15deg)}16%{transform:rotate(-12deg)}24%{transform:rotate(15deg)}32%{transform:rotate(-12deg)}40%{transform:rotate(6deg)}}
@keyframes lift{0%,44%,100%{transform:translateY(0)}8%,24%{transform:translateY(-3px)}16%,32%{transform:translateY(0)}}
@keyframes chin{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes found{0%{transform:translateY(0)}35%{transform:translateY(-9px)}60%{transform:translateY(1.5px)}100%{transform:translateY(0)}}
@keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-8px)}55%{transform:translateY(0)}75%{transform:translateY(-2.5px)}100%{transform:translateY(0)}}
@keyframes stir{0%{transform:translate(6px,0) rotate(4deg)}25%{transform:translate(0,2.5px) rotate(0)}50%{transform:translate(-6px,0) rotate(-4deg)}75%{transform:translate(0,-2px) rotate(0)}100%{transform:translate(6px,0) rotate(4deg)}}
@keyframes sway{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes roll{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes grain{from{transform:translateY(0)}to{transform:translateY(6px)}}
@keyframes winkA{0%,62%,100%{opacity:1}72%,86%{opacity:0}}
@keyframes winkB{0%,62%,100%{opacity:0}72%,86%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .fc *{animation:none!important;transition:none!important} .layer,.faceSlot svg,.content>div,.msg{transition:none} }

/* display content */
.small-dim{font-size:max(2.8cqh,9.5px);font-weight:300;letter-spacing:.07em;color:var(--scr-dim);text-align:center}
.ttl{font-size:max(4.6cqh,13px);font-weight:400;line-height:1.15;text-align:center;border:none;background:none;color:var(--scr-fg);padding:.4cqh 2cqw;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.8cqh;text-decoration-color:#6c6964;max-width:70cqw}
.why{font-size:max(3.1cqh,10px);font-weight:300;line-height:1.3;color:#cfcac2;text-align:center;max-width:64cqw}
.cbtn{border:none;border-radius:999px;background:var(--scr-fg);color:var(--scr-bg);font-size:max(3.4cqh,10.5px);padding:1.2cqh 4.4cqw;font-weight:500;white-space:nowrap}
.cbtn:disabled{background:#2e2d2b;color:#6e6b66;cursor:default}
.rbtn{border:1px solid #57544f;border-radius:999px;background:transparent;color:#bdb9b2;font-size:max(3.1cqh,10px);font-weight:300;padding:1.1cqh 3.6cqw;white-space:nowrap}
.btns{display:flex;gap:2.4cqw;align-items:stretch}
.btns button{min-width:27cqw}
.dots{display:flex;gap:2.2cqw}
.dots button{width:max(1.9cqh,6px);height:max(1.9cqh,6px);border-radius:50%;border:none;padding:0;background:#3d3c39}
.dots button.on{background:var(--scr-fg)}
/* AREA SICURA DELLO SCHERMO CIRCOLARE (unità: % del diametro, 1cqw = 1cqh).
   A quota y dall'alto la corda del cerchio vale c(y) = 2*sqrt(50^2 - (y-50)^2): verso il basso si accorcia in fretta.
   Ogni elemento sta in una fascia orizzontale e non è più largo della corda al bordo della fascia più lontano dal centro,
   meno un margine di 4 per lato:
   - puntini        8-10      c(8)=54,2    -> riga di 3 puntini, circa 12
   - titolo        66,5-73    c(73)=88,8   -> al massimo 70, una riga (titolo intero anche in chat)
   - bottoni       74-80,5 (centro 77,25)  c(80,5)=79,4  -> riga al massimo 71: qui 58, per stare comoda
                   anche dentro il bordo visibile del disco nero, che nell'immagine è un po' più interno
   - elenco        16-68      c(16)=73,3   -> largo 72 (margini 14)
   - valori        15-56      ben dentro
   Nessun corpo minimo in pixel dentro queste fasce: a schermo piccolo un minimo in px faceva uscire le scritte. */
.foot{position:absolute;left:0;right:0;top:74cqh;height:6.5cqh;display:flex;justify-content:center}
.foot .btns{width:70cqw;width:min(58cqw, calc(2cqw * sqrt(2500 - pow(80.5 - 50, 2)) - 8cqw));height:100%;gap:3cqw}
.foot .btns button{flex:1 1 0;min-width:0;height:100%;padding:0 1cqw;font-size:4.6cqw;line-height:1;overflow:hidden;text-overflow:ellipsis}
.foot .rbtn{border-width:1px}
.topdots{position:absolute;left:0;right:0;top:8cqh;height:2cqh;display:flex;justify-content:center;align-items:center}
.topdots .dots{gap:2.4cqw}
.topdots .dots button{width:max(2cqw,5px);height:max(2cqw,5px)}
.res{position:absolute;left:15cqw;right:15cqw;top:66.5cqh;height:6.5cqh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.res .ttl{flex:none;max-width:70cqw;padding:0 1cqw;text-decoration-thickness:1px;text-underline-offset:.7cqh}
.res .tt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:6cqw;line-height:1.2}
.res .why{max-height:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:10.5px;line-height:1.3;max-width:76cqw}
.prow{display:flex;gap:4cqw;justify-content:center}
.pc{width:var(--pc,17cqw);height:var(--pc,17cqw);flex:none;border-radius:50%;border:1px solid #d8d5cf;background:#000;color:var(--scr-fg);font-size:calc(var(--pc,17cqw) * .42);font-weight:300;display:grid;place-items:center;padding:0}
.pill{border:1px solid #d8d5cf;border-radius:999px;background:#000;color:var(--scr-fg);font-size:max(3.4cqh,11px);font-weight:300;letter-spacing:.06em;padding:1.1cqh 5cqw}
.wl{position:absolute;left:14cqw;right:14cqw;top:16cqh;height:52cqh}
.wl.scroll{box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;padding-block:3cqh;
  -webkit-mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent)}
.wl.scroll::-webkit-scrollbar{display:none}
.wr{box-sizing:border-box;position:relative;width:100%;min-width:0;flex:none;height:8.4cqh;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2cqw;padding:0 3cqw;border:none;background:none;color:var(--scr-fg);text-align:left;border-radius:999px;font-size:max(3.6cqh,11px);font-weight:400;transition:opacity .16s var(--ease);touch-action:pan-y}
.wr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr .g{font-variant-numeric:tabular-nums;white-space:nowrap}
.wr .g small{font-size:.72em;letter-spacing:.02em;opacity:.7}
.wr.ed{background:var(--scr-fg);color:var(--scr-bg);grid-template-columns:auto minmax(0,1fr) auto auto;gap:1.4cqw;padding:0 .9cqh}
.wr{grid-template-columns:minmax(0,1fr) auto}
.wr .pm{width:6.4cqh;height:6.4cqh;border-radius:50%;border:none;background:var(--scr-bg);color:var(--scr-fg);font-size:max(3.8cqh,12px);line-height:1;display:grid;place-items:center;padding:0}
.wr.zero .n,.wr.zero .g{color:#5a5752;text-decoration:line-through}
.wr.flag .g{color:var(--scr-calm)}
.wr.ed.flag .g{color:#8a5a00}
.wr.ex .n{color:#5a5752;text-decoration:line-through}
.wr.add{grid-template-columns:1fr;justify-items:center;font-size:max(5cqh,15px);font-weight:300}
.wr.hdr{grid-template-columns:1fr;justify-items:center;font-size:max(2.5cqh,9px);letter-spacing:.14em;text-transform:uppercase;color:#5d5a55;pointer-events:none}
.wr:not(.ed):not(.hdr):active{background:#161615}
@media (prefers-reduced-motion: reduce){ .wr{transition:none} }
.calm{position:absolute;left:12cqw;right:12cqw;top:69cqh;text-align:center;font-size:max(3cqh,10px);font-weight:300;line-height:1.25;color:var(--scr-calm);border:none;background:none;padding:0}
.calm.tap{text-decoration:underline;text-decoration-color:#6b5a38;text-underline-offset:.6cqh}
.calm.dim{color:var(--scr-dim)}
.big{font-size:16cqw;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.unit{font-size:4cqw;font-weight:300;color:var(--scr-dim);letter-spacing:.06em;text-align:center}
.mac{display:flex;gap:6cqw;justify-content:center}
.mac div{display:flex;flex-direction:column;align-items:center;gap:.6cqh}
.mac b{font-weight:300;font-size:8cqw;line-height:1.05;font-variant-numeric:tabular-nums}
.mac span{font-size:3.8cqw;color:var(--scr-dim);letter-spacing:.04em}

/* ---------- conversation card: simulates the spoken dialogue (prototype tool, outside the product) ---------- */
.voice{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msgs{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;padding:2px 2px 4px}
.msgs .empty{margin:auto;font-size:12px;color:var(--fg-2)}
.msg{max-width:90%;display:flex;flex-direction:column;gap:1px;opacity:0;transition:opacity 210ms var(--ease)}
.msg.in{opacity:1}
.msg .who{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.msg .tx{font-size:14px;line-height:1.35;padding:6px 11px;border-radius:14px;overflow-wrap:anywhere}
.msg.m{align-self:flex-start}
.msg.m .tx{background:var(--bg);border:1px solid var(--line);border-top-left-radius:4px}
.msg.u{align-self:flex-end;align-items:flex-end}
.endbox{border-top:1px solid var(--line);padding-top:14px}
.msg-sep{align-self:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);padding:4px 0}
.msg .clk{display:block;margin:3px 0 0 6px;font-size:11.5px;font-style:italic;letter-spacing:.02em;color:var(--clk)}
.msg.u .tx{background:var(--fg);color:var(--bg);border-top-right-radius:4px}
.voice label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.voice .vrow{display:flex;gap:8px}
.voice input{flex:1;min-width:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.voice input:disabled{opacity:.55}
.pillbtn{border:none;border-radius:999px;padding:10px 18px;background:var(--fg);color:var(--bg);font-weight:500}
.pillbtn:disabled{opacity:.4;cursor:default}
.pillbtn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.voice .hint{font-size:12px;color:var(--fg-2)}

/* ---------- research panel (closed by default, opened with the arrow) ---------- */
.panel{min-width:0;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.panel h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);margin:0 0 8px;font-weight:500}
.panel section{display:flex;flex-direction:column;gap:8px}
.kvp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kvp dt{color:var(--fg-2)}
.kvp dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.arch{width:100%;border-collapse:collapse;font-size:12.5px}
.arch td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.loc{color:var(--ok)}.tag.rem{color:var(--accent)}.tag.off{color:var(--fg-2);opacity:.7}
.switch{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.switch button{width:52px;height:30px;border-radius:999px;border:none;background:var(--ok);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:25px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch button[aria-pressed="false"]{background:var(--fg-2)}
.switch button[aria-pressed="false"]::after{left:3px}
.lost{font-size:12.5px;line-height:1.4;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lost div{border-left:2px solid var(--ok);padding-left:8px}
.lost div.x{border-left-color:var(--accent)}
.lost b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--fg-2)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-2)}
.field input,.field select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px;color:var(--fg)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--bg)}
.unf{color:var(--fg-2);font-style:italic}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exprline{font-family:var(--f-mono);font-size:12px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:var(--fg-2);line-height:1.4}
.declare{font-size:12.5px;line-height:1.45;border-left:2px solid var(--accent);padding-left:10px}
details summary{cursor:pointer;font-size:13.5px}
.setup{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;padding:16px}
.setup .card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.setup h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0}
.setup h1 em{font-style:italic}

   allergie scritte), scelta della faccina, log di sessione.
   REMOTO (capacità `sample`): traduzione intento -> formulazione (titolo, ingredienti,
   valori stimati, riga del perché) e, se la composizione cambia, una seconda chiamata
   che rifà la riga del perché (scaffolding).
   Nel prototipo il modello linguistico è remoto; nell'architettura della tesi (par. 6.6)
   la traduzione sta a bordo. Il prototipo ne riproduce la topologia, non la collocazione.
   Il comando di HandPod è vocale: la conversazione sotto il dispositivo simula il dialogo
   parlato per le interviste ed è uno strumento del prototipo, non una funzione del prodotto.

/* MESTOLO DEL MORTAIO (faccina 5). Il perno è il punto in cui il mestolo entra nella bocca del mortaio (106, 138);
   la punta gira su una piccola ellisse (centro 100,153, semiassi 5 e 3) dentro l'area interna. Il tratto passa sempre
   per il perno, quindi fuori dal mortaio sta sopra la bocca e dentro non arriva mai alle pareti: distanza minima fra
   l'asse del mestolo e il contorno della ciotola 10 unità, contro 3,6 di somma dei due spessori (controllato su 720
   posizioni dell'intero giro). */
const PESTLE={P:[106,138], C:[100,153], rx:5, ry:3, out:24, period:2400};
function pestlePose(t){ const tip=[PESTLE.C[0]+PESTLE.rx*Math.cos(t), PESTLE.C[1]+PESTLE.ry*Math.sin(t)], P=PESTLE.P;
 let dx=P[0]-tip[0], dy=P[1]-tip[1]; const n=Math.hypot(dx,dy); dx/=n; dy/=n;
 const e=[P[0]+dx*PESTLE.out, P[1]+dy*PESTLE.out], k=[P[0]+dx*(PESTLE.out+3.2), P[1]+dy*(PESTLE.out+3.2)], f=x=>x.toFixed(2);
 return {d:`M${f(tip[0])} ${f(tip[1])} L${f(e[0])} ${f(e[1])}`, k:k.map(f)}; }
(function pestleLoop(ts){ const els=document.querySelectorAll('.fc[data-f="5"] .ps');
 if(els.length && !matchMedia("(prefers-reduced-motion: reduce)").matches){ const q=pestlePose((ts%PESTLE.period)/PESTLE.period*2*Math.PI);
  els.forEach(g=>{ g.firstElementChild.setAttribute("d",q.d); const c=g.lastElementChild; c.setAttribute("cx",q.k[0]); c.setAttribute("cy",q.k[1]); }); }
 requestAnimationFrame(pestleLoop); })(0);
function faceSVG(n){
 const f=FP[n], eyes=`<g class="eyes"><g class="el"><path fill="#fff" fill-rule="evenodd" d="${f.l}"/></g>`;
 let inner;
 if(n===7) inner=`${eyes}<g class="er"><g class="wkA"><path fill="#fff" fill-rule="evenodd" d="${f.r}"/></g><g class="wkB"><path fill="#fff" fill-rule="evenodd" d="${f.ro}"/></g></g></g>`;
 else inner=`${eyes}<g class="er"><path fill="#fff" fill-rule="evenodd" d="${f.r}"/></g></g>`;
 if(f.h) inner+=`<g class="hd"><path fill="#fff" fill-rule="evenodd" d="${f.h}"/></g>`;
 if(n===5){ const q=pestlePose(0); inner+=`<g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
   <g class="ps"><path class="psl" d="${q.d}"/><circle class="psk" cx="${q.k[0]}" cy="${q.k[1]}" r="4.2" fill="#fff" stroke="none"/></g>
   <path d="M72 138 H128"/><path d="M75 138 C75 160 88 166 100 166 C112 166 125 160 125 138"/><path d="M90 166 V171 H110 V166"/></g>`; }
 if(n===6) inner+=`<g transform="rotate(-28 100 142)"><g class="pin" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
   <clipPath id="pinClip"><rect x="72" y="134" width="56" height="16" rx="8"/></clipPath>
   <rect x="72" y="134" width="56" height="16" rx="8"/><path d="M62 142 H72 M128 142 H138"/><circle cx="58" cy="142" r="4" fill="#fff" stroke="none"/><circle cx="142" cy="142" r="4" fill="#fff" stroke="none"/>
   <g clip-path="url(#pinClip)"><g class="grain" stroke-width="1.6" opacity=".75"><path d="M78 130 H122 M78 136 H122 M78 142 H122 M78 148 H122"/></g></g></g></g>`;
 return `<svg class="fc" data-f="${n}" viewBox="0 0 200 200" aria-hidden="true">${inner}</svg>`;
}

 for(const k of HEALTH_KINDS) for(const key in HEALTH[k]){ const m=t.match(HEALTH[k][key].re); if(m){ out[k].push(key); out.matched.push(m[0]); } }
 /* parole riferite a singoli ingredienti (ceci, pomodoro, avena...): vincolo anche queste */
 const pa=parseAllergies(t); pa.excl.forEach(i=>out.extraIds.push(i)); out.matched.push(...pa.matched);
 /* qualunque ingrediente della tabella nominato nella risposta (banana, kiwi, pomodoro...) diventa un'esclusione:
    un'allergia scritta a parole non deve mai poter rientrare in una proposta */
 const ni=namedIngredients(t, HEALTH_NAME_STOP); ni.ids.forEach(i=>out.extraIds.push(i)); out.matched.push(...ni.words);
 out.extraIds=[...new Set(out.extraIds)];
 out.matched=[...new Set(out.matched)]; return out;
}
/* ingredienti rifiutati per scelta: confronto per radice fra le parole della risposta e i nomi della tabella */
/* parole troppo generiche per indicare un ingrediente in una risposta sulla salute ("frutta a guscio" non è "frutti rossi") */
const HEALTH_NAME_STOP=new Set(["frutta","frutti","secca","secco","guscio","verdura","verdure","cereali","legumi","grano","carne","dolci","zucchero","zuccheri","salsa","fresca","fresco","sale"]);
/* ingredienti nominati in un testo: confronto per radice (5 lettere) fra le parole del testo e quelle dei nomi in tabella */
function namedIngredients(text,extraStop){ const t=String(text||"").toLowerCase(); const ids=new Set(), words=new Set();
 const ws=t.split(/[^\p{L}]+/u).filter(w=>w.length>=4&&!(extraStop&&extraStop.has(w))); const stems=new Map(ws.map(w=>[w.slice(0,5),w]));
 for(const i of INGREDIENTS) for(const L of ["it","en"]){ const toks=String(STRINGS[L].ing[i.id]||"").toLowerCase().split(/[^\p{L}]+/u).filter(w=>w.length>=4&&!NAME_STOP.has(w)&&!(extraStop&&extraStop.has(w)));
  for(const tk of toks){ const st=tk.slice(0,5); if(stems.has(st)){ ids.add(i.id); words.add(stems.get(st)); } } }
 return {ids:[...ids], words:[...words]}; }
const NAME_STOP=new Set(["polvere","farina","aroma","liofilizzato","liofilizzata","macinato","macinati","vegetale","proteine","isolato","concentrato","semi","fiocchi","latte","scorza","bacche","powder","flour","flavour","plant","protein","seeds"]);
function parseRefused(text){
 const t=String(text||"").toLowerCase(); if(!t.trim()||NONE_RE.test(t)) return {text:String(text||""), ids:[]};
 const words=t.split(/[^\p{L}]+/u).filter(w=>w.length>=4).map(w=>w.slice(0,5)); const ids=new Set(parseAllergies(t).excl);
 for(const i of INGREDIENTS) for(const L of ["it","en"]){ const toks=String(STRINGS[L].ing[i.id]||"").toLowerCase().split(/[^\p{L}]+/u).filter(w=>w.length>=4&&!NAME_STOP.has(w)).map(w=>w.slice(0,5));
  if(toks.some(w=>words.includes(w))) ids.add(i.id); }
 return {text:String(text||""), ids:[...ids]};
}
function parseDiet(text){ const t=String(text||""); if(!t.trim()||NONE_RE.test(t)) return {text:t, tags:[]}; return {text:t, tags:DIET_RULES.filter(r=>r.re.test(t)).map(r=>r.tag)}; }
/* split dei macronutrienti con i tetti delle regole (es. carboidrati <= 45%): l'eccesso passa alle altre voci */
function capSplit(pr,cb,ft,rules){ rules=rules||{}; const cap={p:rules.pPctMax??60,c:rules.cPctMax??70,f:45}; let v={p:pr,c:cb,f:ft};
 for(let k=0;k<4;k++){ let ex=0; const free=[]; for(const x of ["p","c","f"]){ if(v[x]>cap[x]){ ex+=v[x]-cap[x]; v[x]=cap[x]; } else if(v[x]<cap[x]) free.push(x); } if(!ex) break; const fs=free.reduce((a,x)=>a+v[x],0)||1; free.forEach(x=>v[x]+=ex*v[x]/fs); }
 const pMin=rules.pPctMin!=null?Math.min(rules.pPctMin,cap.p):null; // se un tetto (es. gotta) e un minimo (dieta proteica) si scontrano, vince il tetto
 if(pMin!=null&&v.p<pMin){ const d=pMin-v.p; v.p+=d; v.c=Math.max(10,v.c-d); } // minimo di proteine (dieta proteica, sport)
 const P=Math.round(v.p), F=Math.round(v.f); return {p:P, c:100-P-F, f:F}; }
/* dalla scheda ai vincoli reali dei guardrail */
function deriveConstraints(p){
 const alg=new Set(), excl=new Set(), rules={}; const min=(k,v)=>{ rules[k]=rules[k]==null?v:(k.endsWith("Min")?Math.max:Math.min)(rules[k],v); }; // tetti: il più stretto; minimi: il più alto
 const h=p.health||{};
 for(const k of HEALTH_KINDS) for(const key of (h[k]||[])){ const r=HEALTH[k][key]; if(!r) continue; (r.alg||[]).forEach(a=>alg.add(a)); (r.ids||[]).forEach(i=>excl.add(i)); for(const q in (r.rules||{})) min(q,r.rules[q]); }
 (h.extraIds||[]).forEach(i=>excl.add(i));
 /* anche le parole della risposta sulla salute, rilette ogni volta: vale per i profili ripresi da file o creati prima */
 if(p.allergyText&&!NONE_RE.test(p.allergyText)) namedIngredients(p.allergyText,HEALTH_NAME_STOP).ids.forEach(i=>excl.add(i));
 for(const tag of ((p.diet&&p.diet.tags)||[])){ const r=DIET_RULES.find(x=>x.tag===tag); if(!r) continue; (r.alg||[]).forEach(a=>alg.add(a)); (r.ids||[]).forEach(i=>excl.add(i)); for(const q in (r.rules||{})) min(q,r.rules[q]); }
 p.alg=[...alg]; p.excl=[...excl].filter(i=>ING[i]); p.refusedIds=((p.refused&&p.refused.ids)||[]).filter(i=>ING[i]); p.rules=rules;
 if(p.base) { const sp=capSplit(p.base.p,p.base.c,p.base.f,rules); p.p=sp.p; p.c=sp.c; p.f=sp.f; }
 return p;
}

function clampTargets(t,p){
 const base=slotKcal(p), lo=Math.max(200,Math.round(base*0.8)), hi=Math.min(950,Math.round(base*1.2));
 if(!t||typeof t!=="object") return {kcal:base,p:p.p,c:p.c,f:p.f,source:"profile+slot", slot:slotInfo().used};
 const num=(v,d)=>{ const n=Number(v); return isFinite(n)&&n>0?n:d; };
 const kcal=Math.round(Math.max(lo,Math.min(hi,num(t.kcal,base))));
 let pr=Math.max(10,Math.min(60,num(t.protein_pct,p.p))), cb=Math.max(10,Math.min(70,num(t.carbs_pct,p.c))), ft=Math.max(10,Math.min(45,num(t.fat_pct,p.f)));
 const sum=pr+cb+ft; const sp=capSplit(pr*100/sum,cb*100/sum,ft*100/sum,p.rules);
 return {kcal,p:sp.p,c:sp.c,f:sp.f,source:"request"};
}

   ownership:{ profile_created:cnt("profile_created")>0, likes_given: ev.some(e=>e.type==="profile_created"&&e.likes_text), pods_confirmed:confirms.length, confirm_origin:confirms.map(e=>e.origin) }
  },
  events:ev
 };

/* ---------------- 6. CALCOLO NUTRIZIONALE (locale, deterministico) ---------------- */
const targets=p=>({E:p.kcal, P:p.kcal*p.p/100/4, C:p.kcal*p.c/100/4, F:p.kcal*p.f/100/9});
function totals(items){ const t={E:0,P:0,C:0,F:0,Fib:0,M:0};
 for(const it of items){ const i=ING[it.id]; if(!i||!it.g) continue; const k=it.g/100; t.E+=i.kcal*k; t.P+=i.P*k; t.C+=i.C*k; t.F+=i.F*k; t.Fib+=i.Fib*k; t.M+=it.g; } return t; }
/* Discesa per coordinate su un errore quadratico relativo (energia, proteine, carboidrati, grassi),
   con un termine che tiene le quantità vicine a quelle di partenza (anchor). Gli ingredienti in
   `fixed` (scelti dall'utente) e quelli a 0 g non si muovono. Il limite di inclusione è rispettato
   in forma esatta: g_i <= m_i * somma_altri / (1 - m_i). */
function solve(items,p,opt={}){
 const fixed=opt.fixed||new Set(), caps=opt.caps||{}, anchorW=opt.anchorW??0.15, minG=opt.minG??1;
 const Tg=targets(p), Tv=[Tg.E,Tg.P,Tg.C,Tg.F], w=[1.5,1,1,1];
 const A=items.map(it=>{const i=ING[it.id]; return [i.kcal/100,i.P/100,i.C/100,i.F/100];});
 const anc=items.map(it=>Math.max(0,(opt.anchor&&opt.anchor[it.id]!=null)?opt.anchor[it.id]:(+it.g||0)));
 const g=items.map(it=>Math.max(0,+it.g||0)), n=g.length;
 const free=items.map((it,i)=>!fixed.has(it.id) && g[i]>0);
 if(!free.some(Boolean)) return items.map(it=>({...it}));
 const capOf=id=>Math.min(ING[id].max/100, caps[id]??1);
 // se i massimi di inclusione degli ingredienti presenti sommano a meno del 100% il limite è
 // impossibile: il calcolo non lo applica (azzererebbe tutto) e il vincolo lo segnala all'utente
 const feasible=items.filter((it,i)=>g[i]>0).reduce((a,it)=>a+capOf(it.id),0)>=1;
 for(let sweep=0;sweep<300;sweep++){
  for(let i=0;i<n;i++){ if(!free[i]) continue;
   const tot=[0,0,0,0]; for(let j=0;j<n;j++) if(j!==i) for(let k=0;k<4;k++) tot[k]+=g[j]*A[j][k];
   let num=0,den=0;
   for(let k=0;k<4;k++){ const r=tot[k]-Tv[k]; num+=-w[k]*r*A[i][k]/(Tv[k]*Tv[k]); den+=w[k]*A[i][k]*A[i][k]/(Tv[k]*Tv[k]); }
   const s=Math.max(anc[i],10); num+=anchorW*anc[i]/(s*s); den+=anchorW/(s*s);
   let x=den>0?num/den:g[i];
   const others=g.reduce((a,v,j)=>j===i?a:a+v,0), m=capOf(items[i].id);
   const hi=(feasible&&m<1)?m*others/(1-m):Infinity;
   x=Math.max(minG,Math.min(x,hi)); g[i]=x;
  }
 }
 const out=items.map((it,i)=>({...it, g:free[i]?Math.max(0,Math.round(g[i])):it.g}));
 for(let guard=0;feasible&&guard<50;guard++){ const M=out.reduce((a,o)=>a+o.g,0); let fx=false;
  out.forEach((o,i)=>{ if(!free[i]) return; const m=Math.min(ING[o.id].max/100,caps[o.id]??1); if(o.g>m*M+1e-9&&o.g>1){o.g--;fx=true;} }); if(!fx) break; }
 return out;
}

/* ---------------- 7. VINCOLI (locali, funzionano anche senza modello) ---------------- */
function violations(items,p){
 const v=[], live=items.filter(it=>it.g>0); if(!live.length) return v;
 const t=totals(live), M=t.M, full=M>=RULES.massMin;
 for(const it of live){ const r=excludedBy(it.id,p); if(r) v.push({key:"allergen:"+it.id, rule:"allergen", ids:[it.id], text:T("g.allergen",{i:nm(it.id)})}); }
 if(full && live.reduce((a,it)=>a+ING[it.id].max,0)<100) v.push({key:"single", rule:"single", ids:[], text:T("g.single")});
 else if(full) for(const it of live){ const i=ING[it.id]; if(it.g/M > i.max/100+0.005) v.push({key:"incl:"+it.id, rule:"incl", ids:[it.id], text:T("g.incl",{i:nm(it.id),m:i.max})}); }
 if(M>RULES.massMax) v.push({key:"mass", rule:"mass", ids:[], text:T("g.mass",{max:fmtSp(RULES.massMax)})});
 const PR=p.rules||{};
 if(full && t.F/M>(PR.fatMaxFrac??RULES.fatMaxFrac)) v.push({key:"fat", rule:"fat", ids:live.filter(it=>ING[it.id].F>=9).map(it=>it.id), text:T("g.fat")});
 if(t.Fib>(PR.fiberMax??RULES.fiberMax)) v.push({key:"fiber", rule:"fiber", ids:live.filter(it=>ING[it.id].Fib>=15).map(it=>it.id), text:T("g.fiber")});
 const pair=live.filter(it=>RULES.pairIds.includes(it.id)), pg=pair.reduce((a,it)=>a+it.g,0);
 if(pair.length===2 && pg>RULES.pairMax) v.push({key:"pair", rule:"pair", ids:pair.map(it=>it.id), text:T("g.pair")});
 const isoG=live.filter(it=>ING[it.id].cls==="iso").reduce((a,it)=>a+it.g,0);
 if(full && isoG/M>RULES.isoMaxFrac) v.push({key:"iso", rule:"iso", ids:live.filter(it=>ING[it.id].cls==="iso").map(it=>it.id), text:T("g.iso")});
 /* limiti che vengono dalla scheda (condizioni, dieta): valori di progetto */
 if(PR.fiberMin!=null && full && t.Fib<PR.fiberMin) v.push({key:"fibmin", rule:"fibmin", ids:[], text:T("g.fibmin")});
 const salty=live.filter(it=>SALTY.includes(it.id)); if(PR.saltyMaxG!=null && salty.reduce((a,it)=>a+it.g,0)>PR.saltyMaxG+0.01) v.push({key:"salt", rule:"salt", ids:salty.map(it=>it.id), text:T("g.salt")});
 if(PR.pPctMax!=null && full && t.E>0 && t.P*4/t.E*100>PR.pPctMax+2) v.push({key:"prot", rule:"prot", ids:live.filter(it=>ING[it.id].P>=25).map(it=>it.id), text:T("g.prot")});
 return v;
}
const curViol=()=>S.comp?violations(S.comp.items,prof()):[];
const massOf=items=>items.reduce((a,it)=>a+(it.g||0),0);

/* Il modello propone, il codice locale verifica: passa di qui PRIMA di essere mostrata. */
function verifyProposal(raw,p){
 const corrections=[], guards=[]; let items=[];
 for(const r of raw){ const id=String(r.id||"");
  if(!ING[id]){ corrections.push({kind:"removed_unknown", id}); continue; }
  if(excludedBy(id,p)){ corrections.push({kind:"removed_excluded", id}); guards.push({rule:"allergen", ids:[id], action:"removed"}); continue; }
  const g=Math.max(1,Math.round(Number(r.grams)||10)); const ex=items.find(x=>x.id===id); if(ex) ex.g+=g; else items.push({id,g}); }
 const before=items.map(x=>({...x})), caps={};
 let solved=solve(items,p,{caps, anchorW:0.45}); // il calcolo corregge la proposta senza appiattirla: resta vicino alle quantità del modello
 for(let k=0;k<8;k++){
  const vv=violations(solved,p).filter(v=>["fat","fiber","pair","iso"].includes(v.rule)); if(!vv.length) break;
  for(const v of vv){ guards.push({rule:v.rule, ids:v.ids, action:"reduced"});
   for(const id of v.ids){ const cur=solved.find(s=>s.id===id), M=massOf(solved); caps[id]=Math.max(0.02,(cur?cur.g/M:0.1)*0.75); } }
  solved=solve(solved,p,{caps,anchorW:0.05});
 }
 for(const b of before){ const a=solved.find(s=>s.id===b.id); if(a&&Math.abs(a.g-b.g)>=2) corrections.push({kind:"quantity", id:b.id, from:b.g, to:a.g}); }
 return {items:solved, corrections, guards};
}
/* Correzione locale proposta dalla riga calma: la tocca l'utente, non scatta da sola. */
function localFix(v){
 const c=S.comp, p=tprof(), it=id=>c.items.find(x=>x.id===id);
 if(v.rule==="allergen"){ v.ids.forEach(id=>{ const x=it(id); if(x) x.g=0; }); }
 else if(v.rule==="incl"){ const x=it(v.ids[0]); const m=ING[x.id].max/100; const others=massOf(c.items)-x.g; x.g=Math.max(1,Math.floor(m*others/(1-m))); c.locked.add(x.id); }
 else if(v.rule==="mass"){ const k=RULES.massMax/massOf(c.items); c.items.forEach(x=>x.g=Math.floor(x.g*k)); }
 else if(v.rule==="single"){ return false; }
 else { for(let k=0;k<20 && violations(c.items,p).some(w=>w.key===v.key);k++) v.ids.forEach(id=>{ const x=it(id); if(x&&x.g>1) x.g=Math.max(1,Math.floor(x.g*0.85)); }); }
 c.items=solve(c.items,p,{fixed:c.locked, anchorW:0.1});
 return true;
}
/* Riga del perché senza modello: regole sul calcolo locale, non AI. */
function localWhy(items,p){
 const live=items.filter(x=>x.g>0); if(!live.length) return "";
 const t=totals(live), tg=targets(p);
 const top=live.slice().sort((a,b)=>ING[b.id].P*b.g-ING[a.id].P*a.g)[0];
 return S.lang==="it" ? `${Math.round(t.E)} kcal su ${tg.E}; proteine soprattutto da ${nm(top.id).toLowerCase()}.` : `${Math.round(t.E)} of ${tg.E} kcal; protein mostly from ${nm(top.id).toLowerCase()}.`;
}



/* ---------------- 8. LIVELLO ESPRESSIVO: quale faccina, da quale stato ---------------- */
/* La faccina mostrata è funzione di una variabile di stato. Le animazioni in loop sono il modo
   in cui ciascuna faccina si muove mentre è visibile: non aggiungono segnali oltre allo stato.
   L'unica successione a tempo fra faccine è la sequenza 5-6-7, simulazione dichiarata. */
function faceFor(){
 if(S.phase==="load") return S.activeFormulation==="loading"?{n:4, v:`S.activeFormulation = "loading"  (le polveri entrano nella ciotola)`}:{n:0, v:"—"};
 if(S.phase==="close_wait") return {n:1, v:`S.phase = "close_wait"  (in attesa che la persona richiuda il coperchio)`};
 if(S.phase==="prep"||S.phase==="done") return {n:[5,6,7][S.prep.step]||7, v:`S.prep.step = ${S.prep.step}  (simulazione a tempo dichiarata)`};
 if(S.pending) return {n:3, v:`S.pending = "${S.pending}"  (chiamata remota in corso)`};
 switch(S.phase){
  case "rest": return {n:1, v:`S.phase = "rest"`};
  case "greet": return {n:2, v:`S.phase = "greet"  (tocco registrato, nessun profilo)`};
  case "create_name": return {n:2, v:`S.phase = "create_name"`};
  case "create_likes": return {n:3, v:`S.phase = "create_likes"`};
  case "create_deep": return {n:3, v:`S.phase = "create_deep"  (domanda di approfondimento)`};
  case "create_allergies": return {n:4, v:`S.phase = "create_allergies"`};
  case "create_mode": return {n:3, v:`S.phase = "create_mode"  (profilo completo o veloce)`};
  case "create_summary": case "create_clarify": case "create_confirm": case "create_correct": return {n:3, v:`S.phase = "${S.phase}"  (controllo e conferma del profilo)`};
  case "slot_taste": return {n:3, v:`S.phase = "slot_taste"  (completamento del profilo: gusti della fascia)`};
  case "create_age": case "create_weight": case "create_diet": case "create_refuse": return {n:3, v:`S.phase = "${S.phase}"`};
  case "create_health": return {n:4, v:`S.phase = "create_health"`};
  case "create_done": return {n:7, v:`S.phase = "create_done"  (profilo salvato)`};
  case "listen": return {n:1, v:`S.phase = "listen"  (profilo attivo, in attesa di un comando)`};
  case "rework": return {n:3, v:`S.phase = "rework"  (rielaborazione richiesta, in attesa dell'indicazione)`};
  case "compose": if(S.ui.screen===0 && S.activeFormulation==="proposed") return {n:4, v:`S.activeFormulation = "proposed", S.ui.screen = 0`}; return {n:0, v:"—"};
 }
 return {n:0, v:"—"};
}

function allergyBlock(p){
 const h=p.health||{}, lab=k=>(h[k]||[]).map(x=>hLabel(k,x)), parts=[];
 if(lab("allergies").length) parts.push("allergies: "+lab("allergies").join(", "));

 const ex=[...p.alg.map(a=>T("alg."+a)),...(p.excl||[]).map(nm)], ref=(p.refusedIds||[]).map(nm);

/* Vincolo locale sul testo: titolo e riga del perché non possono nominare un allergene dichiarato.
   Le parole vietate sono quelle delle famiglie di allergeni del profilo, i nomi degli ingredienti esclusi
   e le parole che la persona ha scritto. Se compaiono, il pezzo di titolo che le contiene viene tolto. */
const ALG_WORDS={glutine:"glutin|frument|gran[oi]|farro|orzo|segale|seitan|gluten|wheat|barley|rye|spelt",soia:"soia|soy|tofu|edamame|tempeh|miso",lupino:"lupin",
 guscio:"nocciol|mandorl|noc[ei](?!\\s+moscata)\\b|pistacch|anacard|pinol|macadamia|hazelnut|almond|walnut|pistachio|cashew|pecan|nut\\b|nuts",
 arachidi:"arachid|noccioline|peanut",sesamo:"sesam|tahin",senape:"senape|mustard",sedano:"sedano|celery"};
function allergyRegex(p){
 const parts=[]; p.alg.forEach(a=>ALG_WORDS[a]&&parts.push(ALG_WORDS[a]));
 (p.allergyWords||[]).forEach(w=>{ const t=String(w).trim().toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,""); if(t.length>=3) parts.push(t); });
 [...p.excl,...(p.refusedIds||[])].forEach(id=>{ const t=nm(id).toLowerCase().split(/[^\p{L}]+/u).find(w=>w.length>=4&&!NAME_STOP.has(w)); if(t) parts.push(t.slice(0,-1).replace(/[.*+?^${}()|[\]\\]/g,"")); });
 return parts.length?new RegExp("("+parts.join("|")+")","i"):null;
}
function guardAllergyText(title,why,p){
 const re=allergyRegex(p); if(!re) return {title,why,hit:null};
 let hit=null; const src=re.test(title)?title:why, m=src.match(re);
 if(m){ const w=src.match(new RegExp("[\\p{L}']*"+m[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[\\p{L}']*","iu")); hit=(w?w[0]:m[0]).replace(/^(all'|dell'|l')/i,""); }
 if(!hit) return {title,why,hit:null};
 // spezza il titolo in pezzi (virgole, «e», «con», «al/alla/ai…») e toglie quelli che nominano l'allergene
 const parts=title.split(/\s*,\s*|\s+(?=(?:e|ed|con|al|alla|allo|alle|ai|agli|all'|and|with)\s)/i).map(x=>x.trim()).filter(Boolean);
 const PREP=/^(al|alla|allo|alle|ai|agli|all'|con|with)\b/i, AND=/^(e|ed|and)\s+/i;
 const groups=[]; parts.filter(x=>!re.test(x)).forEach(x=>{ x=x.replace(AND,""); if(PREP.test(x)&&groups.length) groups[groups.length-1]+=" "+x; else groups.push(x); });
 const joinW=S.lang==="it"?" e ":" and ";
 let t=groups.length<2?(groups[0]||""):groups.slice(0,-1).join(", ")+joinW+groups[groups.length-1];
 if(!t) t=S.lang==="it"?"Piatto senza "+hit.toLowerCase():"Dish without "+hit.toLowerCase();
 t=t.charAt(0).toUpperCase()+t.slice(1);
 const w=re.test(why)?"":why;
 return {title:t, why:w, hit};
}

  changed:Object.keys(N).filter(k=>k in P && Math.abs(N[k]-P[k])>=2).map(k=>({id:k,from:P[k],to:N[k]})), unchanged:Object.keys(N).filter(k=>k in P && Math.abs(N[k]-P[k])<2) };

}
function pourCurrent(){
 const L=S.load; if(!L||!L.waiting) return; L.waiting=false;

 addPowder(it.id,k,L.order.length,col,motion);
 if(motion) pourScoop(col);

/* Colore delle polveri: tinta, saturazione e luminosità di base per classe (palette terrosa, smorzata,
   saturazione <= 42%, luminosità >= 30% per restare leggibile sul fondo nero della ciotola), più una
   variazione deterministica ricavata dall'hash dell'id: lo stesso ingrediente ha sempre lo stesso colore.
   [tinta, saturazione %, luminosità %, ampiezza della variazione di tinta ±] - valori di progetto. */
const POWDER_BASE={iso:[42,24,84,6],conc:[38,28,73,8],flour:[44,36,66,10],cereal:[40,32,77,8],veg:[78,22,50,55],fruit:[350,24,58,30],nut:[30,28,52,10],
 base:[45,16,86,8],analog:[26,32,46,10],herb:[86,22,42,16],spice:[18,38,46,20],umami:[38,10,62,10],sweet:[22,28,34,12],add:[48,8,88,6]};
function hash32(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function powderColor(id){ const b=POWDER_BASE[(ING[id]||{}).cls]||[40,14,60,10], h=hash32(id), u=k=>((h>>>(k*8))&255)/127.5-1;
 const hue=(b[0]+u(0)*b[3]+360)%360, sat=Math.max(6,Math.min(42,b[1]+u(1)*6)), li=Math.max(30,Math.min(90,b[2]+u(2)*7));
 return `hsl(${Math.round(hue)}, ${Math.round(sat)}%, ${Math.round(li)}%)`; }
/* Vista dall'alto: ogni polvere si posa al centro e si allarga fino al suo raggio, coprendo quasi tutta
   la precedente; resta una corona sottile e irregolare. Primo ingrediente al bordo del cono, ultimo al centro.
   Il clip "cone" (r 61 su 100) tiene tutto dentro il cono interno, prima della ghiera metallica. */
function addPowder(id,k,n,col,motion){
 const Rmax=61, r=Rmax*(1-0.62*k/Math.max(n,1)), h=hash32(id+"#");
 let seed=h; const rnd=()=>{ seed=(Math.imul(seed^(seed>>>15),2246822507)+0x9e3779b9)>>>0; return seed/4294967296; };
 const fr=[3+Math.floor(rnd()*3),7+Math.floor(rnd()*4),13+Math.floor(rnd()*6)], ph=fr.map(()=>rnd()*6.283), am=[.03,.016,.009];
 const pts=[]; for(let i=0;i<120;i++){ const a=i/120*6.2832; let d=1; for(let j=0;j<3;j++) d+=am[j]*Math.sin(fr[j]*a+ph[j]); const rr=r*d; pts.push((rr*Math.cos(a)).toFixed(2)+" "+(rr*Math.sin(a)).toFixed(2)); }
 const d="M"+pts.join(" L")+"Z";
 powderLayers.insertAdjacentHTML("beforeend",`<g class="pw" data-ing="${id}"><path d="${d}" fill="${col}" filter="url(#soft)"/><path d="${d}" fill="#000" filter="url(#grain)" opacity=".3"/></g>`);
 const g=powderLayers.lastElementChild;
 /* lo strato comincia a crescere quando il filo di polvere tocca il fondo e si allarga finché il misurino non è dritto */
 if(motion){ g.style.transitionDelay=Math.round(SCOOP.streamHit*POUR_MS)+"ms"; g.style.transitionDuration=Math.round((SCOOP.uprightEnd-SCOOP.streamHit)*POUR_MS)+"ms, 120ms"; }
 void g.getBoundingClientRect(); g.classList.add("in");
}
/* Misurino (asset statico, solo trasformazioni): entra dall'alto, si porta sopra la ciotola, ruota
   in avanti attorno al labbro della coppa fino a rovesciarsi, versa, si raddrizza ed esce. Il perno della
   rotazione è il bordo sinistro della coppa (1,3% e 22,5% dell'immagine) ed è sopra il centro della ciotola. */
function enterScoop(){
 const B=bowlEl.offsetWidth||300; scoopEl.getAnimations().forEach(a=>a.cancel()); streamEl.getAnimations().forEach(a=>a.cancel());
 scoopEl.animate([{transform:`translateY(${-0.62*B}px) rotate(0deg)`, opacity:0},{transform:"translateY(0px) rotate(0deg)", opacity:1}],{duration:SCOOP_IN_MS, easing:"cubic-bezier(.3,.6,.3,1)", fill:"forwards"});
}
function pourScoop(col){
 const D=POUR_MS, B=bowlEl.offsetWidth||300, up=`translateY(${-0.62*B}px)`;
 scoopEl.getAnimations().forEach(a=>a.cancel()); streamEl.getAnimations().forEach(a=>a.cancel());
 scoopEl.animate([
  {offset:0, transform:"translateY(0px) rotate(0deg)", opacity:1, easing:"cubic-bezier(.4,0,.2,1)"},
  {offset:SCOOP.tiltEnd, transform:"translateY(0px) rotate(-140deg)", opacity:1},
  {offset:SCOOP.holdEnd, transform:"translateY(0px) rotate(-140deg)", opacity:1, easing:"cubic-bezier(.4,0,.2,1)"},
  {offset:SCOOP.uprightEnd, transform:"translateY(0px) rotate(0deg)", opacity:1},
  {offset:1, transform:`${up} rotate(0deg)`, opacity:0}],{duration:D, easing:"linear", fill:"none"});
 streamEl.style.background=col;
 const st=SCOOP.streamStart;
 streamEl.animate([
  {offset:0, clipPath:"inset(0 0 100% 0)", opacity:0},
  {offset:st, clipPath:"inset(0 0 100% 0)", opacity:1},
  {offset:SCOOP.streamHit, clipPath:"inset(0 0 0% 0)", opacity:1},
  {offset:SCOOP.holdEnd, clipPath:"inset(0% 0 0 0)", opacity:1},
  {offset:SCOOP.uprightEnd-.02, clipPath:"inset(100% 0 0 0)", opacity:1},
  {offset:1, clipPath:"inset(100% 0 0 0)", opacity:0}],{duration:D, fill:"none"});
}

function pickProfile(k){ if(k==="plus"){ S.draft={id:"d"+Date.now(),name:"",mode:null,modeTries:0,likes:"",deepQ:"",deepA:"",deepSource:null,age:null,weight:null,healthText:null,health:null,diet:null,refused:null}; S.phase="create_name"; log("profile_create_start",{}); render(); focusVoice(); return; } chooseProfile(k,false); }
/* ============ CASI LIMITE: COSA CONTA COME RISPOSTA ============
   Tre comportamenti distinti:
   1. NON HO CAPITO  -> "Scusa, non ho capito, puoi ripetere?" e la macchina resta nella stessa fase.
      Vale solo quando l'input non è comprensibile per quella fase (tabella qui sotto).
   2. HO CAPITO MA NON POSSO -> risponde il guardrail con la sua riga calma (motivo + alternativa).
   3. QUALCOSA NON HA FUNZIONATO -> chiamata al modello fallita o risposta malformata: messaggio failMsg.
   Per ogni fase in attesa di input:
   - tutte: vuoto o solo spazi; troppo breve; troppo lungo (oltre il limite della fase); scrittura non latina
     (altra lingua); testo incomprensibile (sequenze senza vocali, tasti a caso, poche lettere);
     richieste che non riguardano la Pod (meteo, musica, timer, chiamate...).
   - nome: 1-3 parole di sole lettere, niente numeri né frasi ("mi chiamo X" è accettato e ne prende X).
   - completo/veloce: una delle due scelte riconosciuta dalle regole locali; se non basta e c'è rete, il modello.
   - età: un numero (anche in lettere, es. "trentaquattro") fra 10 e 110. Parole senza numero: tipo sbagliato.
   - peso: un numero fra 25 e 250 kg.
   - allergie e condizioni: "nessuna" oppure almeno una voce del vocabolario riconosciuta.
   - dieta: "nessuna" oppure almeno una dieta riconosciuta.
   - ingredienti mai: "nessuno" oppure almeno un ingrediente della tabella riconosciuto.
   - gusti (e gusti di una fascia): parole di gusto, cibo o momento della giornata; con rete il modello può dire "non pertinente".
   - approfondimento: qualunque risposta breve sensata, anche "sì" o "no".
   - richiesta di composizione e rielaborazione: controlli comuni qui; poi il modello risponde {"understood":false}
     se la richiesta non riguarda il cibo, è assurda o in un'altra lingua.
   - "correggo io?": sì oppure no.
   Dopo due incomprensioni consecutive nella stessa fase, alla terza la macchina non ripete la stessa frase ma
   riformula la domanda in modo più concreto, con un esempio di risposta valida (STRINGS.reask): niente giri chiusi.
   LOG: ogni caso limite è un evento "edge_case" con fase, comportamento (not_understood | understood_cannot |
   failure), motivo e input che lo ha provocato; nelle fasi sanitarie (età, peso, salute, dieta) l'input non è conservato. */
const SENS_INPUT=["create_age","create_weight","create_health","create_diet"];
function edgeCase(phase,behaviour,reason,input,extra){ const t=String(input??"");
 log("edge_case",{phase, behaviour, reason, input:(!LOG_FULL_PROFILE&&SENS_INPUT.includes(phase))?(t.trim()?"[dato sensibile non registrato]":""):t.slice(0,300), input_length:t.length, ...(extra||{})}); }
const NOTU_LIMITS={create_name:40, listen:300, rework:300};
const NONLATIN=/[\u0370-\u03FF\u0400-\u04FF\u0590-\u05FF\u0600-\u06FF\u0900-\u097F\u0E00-\u0E7F\u3040-\u30FF\u3400-\u9FFF\uAC00-\uD7AF]/;
const OFFTOPIC_RE=/\b(meteo|che tempo fa|piove|musica|canzon|suona|timer|sveglia|promemoria|chiama|telefon|notizie|barzellett|che ore sono|weather|music|song|play|alarm|reminder|call|news|joke|what time)\b/i;
const VOWEL=/[aeiouyàèéìíòóùú]/i;

function basicCheck(t,phase){ t=String(t||""); const tr=t.trim(), max=NOTU_LIMITS[phase]||200;
 if(!tr) return "empty"; if(tr.length>max) return "too_long"; if(NONLATIN.test(tr)) return "other_language"; if(gibberish(tr)) return "gibberish";
 if(OFFTOPIC_RE.test(tr)) return "off_topic"; return null; }
const IT_NUM=(()=>{ const u=["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"], d={venti:20,trenta:30,quaranta:40,cinquanta:50,sessanta:60,settanta:70,ottanta:80,novanta:90}, m={};
 u.forEach((w,i)=>m[w]=i); for(const k in d){ m[k]=d[k]; const st=k.slice(0,-1); u.slice(1,10).forEach((w,i)=>{ const v=d[k]+i+1; m[(/^[ou]/.test(w)?st:k)+w]=v; m[k+w]=v; }); }

const NAME_BAD=/^(che|cosa|come|non|perch|quando|dove|chi|ciao|boh|niente|nessun|sì|si|no|ok|what|how|why|hello|hi|yes)$/i;
const TASTE_RE=/dolc|salat|amar|acid|aspr|piccant|spezi|sapor|gust|legger|sostanzios|croccant|morbid|cremos|fresc|cald|fredd|delicat|decis|intens|neutr|tostat|affumicat|frutt|verdur|ortagg|carne|pesce|pasta|riso|pane|formagg|cioccolat|caff|tè\b|latte|yogurt|uov|legum|cereal|zupp|insalat|dessert|semplic|mediterran|etnic|orient|indian|messican|giappones|mi piace|adoro|amo\b|preferisc|odio|non mi piace|sweet|salty|savou?ry|bitter|sour|spic|light|hearty|crunch|creamy|fresh|food|meal/i;
const ANSWER_SHORT=/^(sì|si|no|ok|certo|a volte|spesso|sempre|mai|poco|molto|abbastanza|dipende|forse|yes|no|sometimes|often|always|never|maybe)\b/i;
const NO_RE=/^\s*(no|non correggere|lascia|lascia stare|lascia così|va bene così|non serve|keep|leave it|no thanks)(?=$|[\s,.!])/i;
/* ritorna {ok:true, value} oppure {ok:false, reason} */
function validate(phase,raw){
 const t=String(raw||"").trim(); const bc=basicCheck(t,phase);

  case "create_name": { if(bc&&bc!=="off_topic") return {ok:false,reason:bc}; let n=t.replace(/^(mi chiamo|il mio nome è|il mio nome e'|sono|io sono|chiamami|my name is|i'm|i am|call me)\s+/i,"").replace(/[.!]+$/,"").trim();
   if(!/^\p{L}[\p{L}'’ -]*$/u.test(n)) return {ok:false,reason:/\d/.test(n)?"wrong_type":"not_a_name"};
   const w=n.split(/\s+/); if(w.length>3) return {ok:false,reason:"sentence"}; if(w.some(x=>NAME_BAD.test(x))) return {ok:false,reason:"not_a_name"}; if(!VOWEL.test(n)) return {ok:false,reason:"gibberish"};

  case "create_mode": if(bc) return {ok:false,reason:bc}; return {ok:true, value:t};
  case "create_age": { if(bc&&bc!=="gibberish") return {ok:false,reason:bc}; const n=readNumber(t); if(n==null) return {ok:false,reason:"wrong_type"}; if(n<10||n>110) return {ok:false,reason:"out_of_range"}; return {ok:true, value:Math.round(n)}; }
  case "create_weight": { if(bc&&bc!=="gibberish") return {ok:false,reason:bc}; const n=readNumber(t); if(n==null) return {ok:false,reason:"wrong_type"}; if(n<25||n>250) return {ok:false,reason:"out_of_range"}; return {ok:true, value:Math.round(n*10)/10}; }
  case "create_health": { if(bc) return {ok:false,reason:bc}; if(isNone) return {ok:true, value:""}; const h=parseHealth(t); if(!HEALTH_KINDS.some(k=>h[k].length)&&!h.extraIds.length&&!/allerg|intoller|celiac|malatt|soffro|non posso mangiare|non tollero|mi fa male|allergic|intoleran|can't eat|cannot eat/i.test(t)) return {ok:false,reason:"not_recognised"}; return {ok:true, value:t}; }
  case "create_diet": { if(bc) return {ok:false,reason:bc}; if(isNone) return {ok:true, value:""}; if(!parseDiet(t).tags.length) return {ok:false,reason:"not_recognised"}; return {ok:true, value:t}; }
  case "create_refuse": { if(bc) return {ok:false,reason:bc}; if(isNone) return {ok:true, value:""}; if(!parseRefused(t).ids.length) return {ok:false,reason:"not_recognised"}; return {ok:true, value:t}; }
  case "create_likes": case "slot_taste": { if(bc) return {ok:false,reason:bc}; if(t.length<3) return {ok:false,reason:"too_short"};

const CONFIRM_RE=/^\s*(s[iì]|esatto|giusto|corretto|perfetto|ok|okay|va bene|confermo|certo|proprio così|yes|right|correct|exactly|that's right)(?=$|[\s,.!])/i;
async function profilePatch(question,answer,field,kind){

/* 5.2: domanda di approfondimento sui gusti, scritta dal modello remoto e controllata qui. Senza rete,
   o se la risposta non è una domanda valida, la macchina usa una domanda di riserva locale, senza errori. */
/* l'approfondimento ha un compito preciso: trovare i momenti della giornata che la risposta non copre e chiedere del più
   rilevante; se li copre tutti, approfondire un aspetto di ciò che è stato detto. Riassume anche i gusti per momento. */
function deepPrompt(likes){ const L=LANGNAME[S.lang];
 return `HandPod is a home food device getting to know a new person before cooking for them. Asked «${T("askTastes")}», the person answered: «${likes}».
The five moments of the day are: colazione (breakfast), pranzo (lunch), merenda (afternoon snack), cena (dinner), spuntino (late snack).
1. Decide which moments the answer covers, explicitly or clearly. Summarise in a few words in ${L} what they like for each covered moment.
2. If some moments are not covered, ask ONE short question in ${L} about the most relevant missing one (main meals pranzo and cena before colazione, then merenda and spuntino). If all five are covered, ask ONE short question that goes deeper into something specific they said.
3. If the answer is not about food or taste at all, or is nonsense, or is in a language other than Italian or English, set understood to false.
Rules for the question: a real question ending with "?", at most 15 words, do not repeat or paraphrase their answer, no greeting, no praise, no filler.
Reply with only {"understood":true,"covered":{"colazione":"<few words>"|null,"pranzo":...,"merenda":...,"cena":...,"spuntino":...},"asked_about":"colazione|pranzo|merenda|cena|spuntino|none","question":"..."}`; }
/* lettura locale (senza rete) dei momenti nominati in una risposta: ogni pezzo di frase va al momento che nomina */
const SLOT_RE={colazione:/mattin|colazion|sveglia|breakfast|morning/i, pranzo:/pranz|mezzogiorno|lunch|midday|noon/i, merenda:/merend|pomerigg|afternoon/i, cena:/\bsera\b|serat|\bcena|dinner|evening/i, spuntino:/notte|spuntin|tard[io]\b|dopocena|late|night/i};
const SLOT_WORD="(?:colazion\\w*|pranz\\w*|cena|merend\\w*|spuntin\\w*|sera|serata|mattin\\w*|pomerigg\\w*|notte|breakfast|lunch|dinner|evening|morning|night)";
/* le frasi si spezzano alle virgole e alle congiunzioni; i pezzi senza pasto si uniscono al pasto vicino
   ("dolce e leggero al mattino e salato e sostanzioso la sera" -> colazione: dolce e leggero; cena: salato e sostanzioso) */
/* RISPOSTA SU COLAZIONE, PRANZO E CENA. Le virgole separano i pasti. Un pezzo che nomina il pasto va a quel pasto;
   i pezzi che non lo nominano vanno, nell'ordine in cui sono scritti, ai pasti della domanda rimasti liberi
   (colazione, pranzo, cena). "latte e biscotti, pranzo proteico e cena leggera" -> colazione: latte e biscotti. */
function extractMeals(text){ const out={}, free=[];
 for(const piece of String(text||"").split(/\s*[;,]\s*|\.\s+/).map(x=>x.trim()).filter(Boolean)){
  const f=extractSlots(piece); if(Object.keys(f).length){ for(const [k,v] of Object.entries(f)) out[k]=out[k]?out[k]+", "+v:v; } else free.push(piece); }
 const open=["colazione","pranzo","cena"].filter(k=>!out[k]);
 /* una frase sola senza pasti ("mangio di tutto") non si assegna: resta nei gusti generali */
 if(!Object.keys(out).length&&free.length<2) return out;
 free.slice(0,open.length).forEach((x,i)=>out[open[i]]=x.replace(/^(e|ed|poi|and)\s+/i,"").slice(0,80));
 return out; }
function extractSlots(text){ const out={}, has=x=>SLOTS.find(k=>SLOT_RE[k].test(x));
 for(const piece of String(text||"").split(/[.;,]/)){
  const atoms=piece.split(/\s+(?:e|ed|ma|mentre|and|but|while)\s+/i).map(x=>x.trim()).filter(Boolean), groups=[]; let cur=[], buf=[];
  for(const at of atoms){ if(has(at)){ if(cur.some(has)){ groups.push(cur); cur=[...buf,at]; buf=[]; } else { cur=[...cur,...buf,at]; buf=[]; } } else { if(cur.some(has)) buf.push(at); else cur.push(at); } }
  cur=[...cur,...buf]; if(cur.length) groups.push(cur);
  for(const g of groups){ const cl=g.join(" e "), k=has(cl); if(!k) continue;
   const clean=cl.replace(new RegExp("\\b(?:a|al|alla|per|la|il|di|in|at|for)?\\s*"+SLOT_WORD+"\\b","ig"),"").replace(/\s{2,}/g," ").replace(/^[\s:,-]+|[\s:,-]+$/g,"").replace(/^e\s+|\s+e$/,"").trim()||cl;
   out[k]=out[k]?out[k]+", "+clean:clean; } }
 return out; }
function cleanQ(q,likes){ q=String(q||"").trim().replace(/^["«»“”']+|["«»“”']+$/g,"").trim(); if(!q.endsWith("?")) return null;
 const words=q.split(/\s+/).filter(Boolean); if(words.length<3||words.length>15) return null;
 const a=String(likes||"").toLowerCase().trim(); if(a.length>=12&&q.toLowerCase().includes(a)) return null; return q; }
/* GUSTI: la prima risposta copre colazione, pranzo e cena; la seconda domanda è fissa e chiede solo la merenda.
   Nessuna chiamata al modello in questa fase. La risposta sulla merenda vale anche per lo spuntino. */
function askDeep(){
 const d=S.draft; d.tastes=d.tastes||{};
 Object.assign(d.tastes, extractMeals(d.likes));
 d.askedAbout="merenda"; d.deepQ=T("askMerenda"); d.deepSource="fixed"; understood();
 log("profile_followup_question",{text:d.deepQ, source:"fixed", asked_about:"merenda", covered:Object.keys(d.tastes).filter(k=>d.tastes[k])});
 S.phase="create_deep"; render(); focusVoice();
}
function startManual(){ S.line=null; openComposition({source:"manual", items:[]}); sayMissing(); render(); }
function tapScreen(){
 if(!S.session||S.session.ended) return;
 if(S.phase==="rest"){ S.phase="greet"; log("approach",{via:"touch"}); render(); return; }
 if(S.phase==="greet"){ S.phase="profile"; log("profile_screen",{via:"touch"}); render(); return; }
 if(S.phase==="create_done"){ chooseProfile(S.newKey,true); return; }
 if(["deep","mode","summary","patch"].includes(S.pending)) return;
 if(S.phase==="listen" && !remoteReady()){ startManual(); return; }
 if(S.phase==="slot_taste"){ log("profile_slot_cancelled",{slot:S.slotAsk&&S.slotAsk.slot}); S.slotAsk=null; S.phase="listen"; render(); return; }
 if(S.phase==="rework"){ log("rework_cancelled",{n:S.rework&&S.rework.n}); S.phase="compose"; S.line=null; S.rework=null; render(); return; }
}

function composeMsg(c){ const parts=[T("thought")+" "+(c.title||"Pod")];

function stateMsg(){
 const P=S.phase;
 if(S.pending) return {sig:"pend|"+S.pendSeq, text:["deep","mode","summary","patch"].includes(S.pending)?null:T("thinking")}; // la domanda di approfondimento si prepara in silenzio, con la faccina 3 già in vista
 switch(P){

  case "create_name": return {sig:P, text:T("askName")};
  /* le domande della creazione profilo si pongono una volta per bozza: un "non ho capito" o una chiamata in corso non le ripetono */
  case "create_mode": return {sig:P+"|"+S.draft.id, once:true, text:T("askMode",{n:S.draft.name})};
  case "create_likes": return {sig:P+"|"+S.draft.id, once:true, pre:S.draft.mode==="quick"?[T("quickOk")]:[], text:T("askTastes")};
  case "create_age": return {sig:P, pre:[T("fullOk")], text:T("askAge")};
  case "create_weight": return {sig:P, text:T("askWeight")};
  case "create_health": return {sig:P, text:T("askHealth")};
  case "create_diet": return {sig:P, text:T("askDiet")};
  case "create_refuse": return {sig:P, text:T("askRefuse")};
  case "create_deep": return {sig:P+"|"+S.pendSeq, text:T("deepIntro")+" "+S.draft.deepQ};
  case "create_allergies": return {sig:P, text:T("askAllergies")};
  case "create_clarify": return {sig:P+"|"+S.draft.id+"|"+S.draft.sumVer, once:true, pre:[S.draft.summary], text:S.draft.clarifyQ};
  case "create_confirm": return {sig:P+"|"+S.draft.id+"|"+S.draft.sumVer, once:true, pre:[S.draft.summary], text:T("confirmQ")};
  case "create_correct": return {sig:P+"|"+S.draft.id, once:true, text:T("askCorrect")};
  case "create_done": return {sig:P+"|"+S.newKey, pre:(S.draft&&S.draft.finalSummary)?[S.draft.finalSummary]:[], text:T("allReady")};
  case "listen": { if(S.line) return {sig:"listen|"+S.line, text:S.line}; if(!remoteReady()) return {sig:"listen|off|"+S.lang, text:T("pickOffline"), click:true};
   /* il saluto si calcola una volta per ingresso nell'ascolto: l'ora non cambia a ogni ridisegno */
   const gk=S.profileKey+"|"+S.slotForced+"|"+S.lang+"|"+(S.listenSeq||0); if(!S.greet||S.greet.key!==gk){ S.greet={key:gk, ...greeting()}; }
   return {sig:"listen|"+gk, text:S.greet.text, extra:S.greet.extra}; }
  case "rework": { const t=S.line||T("reworkAsk"); return {sig:"rework|"+t, text:t}; }
  case "compose": { const c=S.comp; return (c&&S.activeFormulation==="proposed")?{sig:"compose|"+c.id, once:true, note:"swipeNote", text:composeMsg(c), logText:(c.allergyNote&&!LOG_FULL_PROFILE)?composeMsg({...c,allergyNote:null})+" [nota sul profilo non registrata]":null}:null; }
  case "close_wait": return {sig:"close_wait|"+(S.load&&S.load.id), once:true, text:T("closeMe"), click:true};

 }

let lastSig=null; const onceSigs=new Set();

 /* il drag verticale scorre l'elenco; col dito lo fa il browser, col mouse lo fa questa riga */
